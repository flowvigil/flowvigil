name: FlowVigil X Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger X Monitor
        run: |
          curl -L -X GET https://flowvigil.com/api/x-monitor \
            -H "Authorization: Bearer flowvigil-monitor-2026" \
            --fail \
            --show-error
